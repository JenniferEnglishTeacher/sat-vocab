<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barron's 1100 · Units 1–10 · Difficulty Vocab Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --font-heading: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', 'Segoe UI', sans-serif;
  --primary: #1a3a5c;
  --accent: #c8962e;
  --correct: #2d7a4f;
  --incorrect: #b53a2f;
  --clue-bg: #fff3a3;
  --surface: #faf8f5;
  --card: #ffffff;
  --border: #dde3ea;
  --text: #1e2a35;
  --muted: #6b7a8d;
  --diff1: #2d7a4f;
  --diff2: #c8962e;
  --diff3: #d05c2f;
  --diff4: #b53a2f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--surface); color: var(--text); min-height: 100vh; }

/* ── TOP BAR ── */
.topbar {
  background: var(--primary); color: #fff; padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.topbar-title { font-family: var(--font-heading); font-size: 1.15rem; letter-spacing: .3px; }
.topbar-title span { color: var(--accent); }
.score-pill {
  background: rgba(255,255,255,.15); border-radius: 20px;
  padding: 4px 14px; font-size: .85rem; font-weight: 600; white-space: nowrap;
}

/* ── TABS ── */
.tabs { display: flex; background: #fff; border-bottom: 2px solid var(--border); position: sticky; top: 52px; z-index: 99; }
.tab-btn {
  flex: 1; padding: 11px 6px; border: none; background: none; cursor: pointer;
  font-family: var(--font-body); font-size: .88rem; font-weight: 600; color: var(--muted);
  border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .2s;
}
.tab-btn.active { color: var(--primary); border-bottom-color: var(--accent); }
.tab-btn:hover:not(.active) { color: var(--primary); background: #f5f7fa; }

/* ── FILTERS ── */
.filters {
  padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.filter-label { font-size: .8rem; font-weight: 600; color: var(--muted); margin-right: 4px; }
.filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 4px 12px; border-radius: 20px; border: 1.5px solid var(--border);
  font-size: .78rem; font-weight: 600; cursor: pointer; background: #fff;
  color: var(--muted); transition: all .15s;
}
.chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.chip.diff1.active { background: var(--diff1); border-color: var(--diff1); }
.chip.diff2.active { background: var(--diff2); border-color: var(--diff2); }
.chip.diff3.active { background: var(--diff3); border-color: var(--diff3); }
.chip.diff4.active { background: var(--diff4); border-color: var(--diff4); }

/* ── WORD HELPER ── */
.word-helper {
  margin: 0 16px 0; padding: 10px 14px; background: #eef3fb;
  border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0;
  font-size: .83rem; line-height: 1.5; display: none; animation: fadeIn .2s;
}
.word-helper.show { display: block; }
.word-helper strong { color: var(--primary); }

/* ── MAIN CONTENT ── */
.page { display: none; padding: 16px; max-width: 860px; margin: 0 auto; }
.page.active { display: block; }

/* ── FLASHCARD GRID ── */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.flash-card {
  background: var(--card); border-radius: 12px; border: 1.5px solid var(--border);
  overflow: hidden; cursor: pointer; transition: box-shadow .2s, transform .15s;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.flash-card:hover { box-shadow: 0 4px 16px rgba(26,58,92,.15); transform: translateY(-2px); }
.flash-card .fc-header {
  padding: 10px 14px 8px; background: linear-gradient(135deg, var(--primary), #2a5298);
  display: flex; justify-content: space-between; align-items: center;
}
.fc-word { font-family: var(--font-heading); font-size: 1.1rem; color: #fff; font-weight: 700; }
.fc-pos { font-size: .75rem; color: rgba(255,255,255,.75); font-style: italic; }
.diff-badge {
  font-size: .8rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; color: #fff;
  background: rgba(255,255,255,.2);
}
.flash-card .fc-body { padding: 10px 14px 12px; }
.fc-def { font-size: .85rem; color: var(--text); margin-bottom: 5px; line-height: 1.4; }
.fc-cn { font-size: .88rem; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
.fc-syn { font-size: .78rem; color: var(--muted); }
.fc-unit { font-size: .72rem; color: #aaa; margin-top: 4px; }

/* ── FLASHCARD MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 200; align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: 16px; width: 100%; max-width: 580px;
  max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-header {
  padding: 18px 20px 14px; background: linear-gradient(135deg, var(--primary), #2a5298);
  border-radius: 16px 16px 0 0; position: relative;
}
.modal-word { font-family: var(--font-heading); font-size: 1.6rem; color: #fff; }
.modal-pos { font-size: .85rem; color: rgba(255,255,255,.75); font-style: italic; margin-top: 2px; }
.modal-close {
  position: absolute; right: 16px; top: 16px; background: rgba(255,255,255,.2);
  border: none; color: #fff; border-radius: 50%; width: 30px; height: 30px;
  cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
}
.modal-body { padding: 18px 20px; }
.modal-row { margin-bottom: 14px; }
.modal-label { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
.modal-val { font-size: .92rem; line-height: 1.55; color: var(--text); }
.modal-cn { font-size: 1rem; color: var(--accent); font-weight: 600; }
.modal-passage { font-size: .9rem; line-height: 1.6; background: #f5f7fa; border-radius: 8px; padding: 12px 14px; }
.modal-passage .blank { font-weight: 700; color: var(--primary); border-bottom: 2px solid var(--accent); }
.modal-cn-passage { font-size: .88rem; line-height: 1.6; color: #555; margin-top: 8px; }
.tts-btn {
  background: none; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 5px 12px; cursor: pointer; color: var(--muted); font-size: .8rem;
  display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; transition: all .15s;
}
.tts-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ── QUIZ MODE ── */
.quiz-header { margin-bottom: 16px; }
.quiz-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.quiz-progress-text { font-size: .82rem; font-weight: 600; color: var(--muted); }
.quiz-score-text { font-size: .88rem; font-weight: 700; color: var(--primary); }
.progress-bar { height: 6px; background: #dde3ea; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }

.q-card {
  background: var(--card); border-radius: 14px; border: 1.5px solid var(--border);
  padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 14px;
}
.q-passage {
  font-size: .95rem; line-height: 1.7; color: var(--text); margin-bottom: 14px;
}
.q-passage .word { cursor: pointer; border-bottom: 1px dotted var(--accent); transition: background .15s; }
.q-passage .word:hover { background: #fef9ec; }
.q-passage .blank-target { font-weight: 700; color: var(--primary); border-bottom: 2px solid var(--accent); }
.q-passage .clue-highlight { background: var(--clue-bg); border-radius: 3px; padding: 0 2px; }

.tts-row { margin-bottom: 12px; }
.options-grid { display: grid; gap: 9px; }
.opt-btn {
  width: 100%; text-align: left; padding: 11px 16px; border-radius: 10px;
  border: 1.5px solid var(--border); background: #fff; cursor: pointer;
  font-family: var(--font-body); font-size: .9rem; font-weight: 500; color: var(--text);
  display: flex; align-items: center; gap: 10px; transition: all .15s;
}
.opt-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0f4fa; }
.opt-btn .opt-letter {
  width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid currentColor;
  display: flex; align-items: center; justify-content: center;
  font-size: .75rem; font-weight: 700; flex-shrink: 0;
}
.opt-btn.correct { background: #e8f5ee; border-color: var(--correct); color: var(--correct); }
.opt-btn.incorrect { background: #faeaea; border-color: var(--incorrect); color: var(--incorrect); }
.opt-btn:disabled { cursor: default; }

.feedback-box {
  display: none; background: #f5f7fa; border-radius: 10px; border: 1px solid var(--border);
  padding: 14px; margin-top: 12px;
}
.feedback-box.show { display: block; animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fb-title { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
.fb-word-row { padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; background: #fff; border: 1px solid var(--border); }
.fb-word-row.is-answer { border-color: var(--correct); background: #e8f5ee; }
.fb-word-name { font-weight: 700; color: var(--primary); font-size: .9rem; }
.fb-word-en { font-size: .82rem; color: var(--text); margin-top: 2px; }
.fb-word-cn { font-size: .82rem; color: var(--accent); font-weight: 600; }
.fb-word-sent { font-size: .8rem; color: var(--muted); margin-top: 3px; font-style: italic; }

.next-btn {
  display: none; width: 100%; padding: 13px; border-radius: 10px;
  background: var(--primary); color: #fff; border: none; cursor: pointer;
  font-family: var(--font-body); font-size: .95rem; font-weight: 700;
  letter-spacing: .3px; transition: background .2s; margin-top: 10px;
}
.next-btn.show { display: block; }
.next-btn:hover { background: #2a5298; }

/* ── RESULT SCREEN ── */
.result-screen {
  display: none; text-align: center; padding: 32px 20px;
  background: var(--card); border-radius: 16px; border: 1.5px solid var(--border);
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}
.result-screen.show { display: block; animation: fadeIn .4s; }
.result-icon { font-size: 3.5rem; margin-bottom: 12px; }
.result-score { font-family: var(--font-heading); font-size: 2.8rem; color: var(--primary); font-weight: 700; }
.result-pct { font-size: 1.1rem; color: var(--muted); margin-bottom: 12px; }
.result-msg-en { font-size: 1rem; color: var(--text); margin-bottom: 4px; line-height: 1.5; }
.result-msg-cn { font-size: .9rem; color: var(--muted); margin-bottom: 20px; }
.restart-btn {
  padding: 12px 32px; border-radius: 10px; background: var(--accent); color: #fff;
  border: none; cursor: pointer; font-size: .95rem; font-weight: 700;
  font-family: var(--font-body); transition: background .2s;
}
.restart-btn:hover { background: #b5851f; }

/* ── QUIZ SETUP ── */
.quiz-setup {
  background: var(--card); border-radius: 14px; border: 1.5px solid var(--border);
  padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 14px;
}
.setup-title { font-family: var(--font-heading); font-size: 1.15rem; color: var(--primary); margin-bottom: 14px; }
.setup-row { margin-bottom: 14px; }
.setup-row label { display: block; font-size: .82rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.setup-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.start-btn {
  width: 100%; padding: 13px; border-radius: 10px; background: var(--primary);
  color: #fff; border: none; cursor: pointer; font-family: var(--font-body);
  font-size: .95rem; font-weight: 700; transition: background .2s; margin-top: 4px;
}
.start-btn:hover { background: #2a5298; }

/* ── DIFF COLORS ── */
.diff-1 { color: var(--diff1); } .diff-2 { color: var(--diff2); }
.diff-3 { color: var(--diff3); } .diff-4 { color: var(--diff4); }

/* ── RESPONSIVE ── */
@media (max-width: 500px) {
  .topbar-title { font-size: 1rem; }
  .card-grid { grid-template-columns: 1fr; }
  .q-card { padding: 14px; }
}
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-state i { font-size: 2.5rem; margin-bottom: 10px; color: var(--border); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">Barron's 1100 · <span>Units 1–10</span> · Difficulty Vocab</div>
  <div class="score-pill" id="globalScore">Score: 0 / 0</div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('study')"><i class="fa fa-book-open"></i> Study</button>
  <button class="tab-btn" onclick="switchTab('quiz')"><i class="fa fa-circle-question"></i> Quiz</button>
</div>

<!-- ══════════ STUDY PAGE ══════════ -->
<div class="page active" id="page-study">
  <div class="filters" id="study-filters">
    <span class="filter-label">Unit:</span>
    <div class="filter-group" id="unit-chips"></div>
    <span class="filter-label" style="margin-left:10px">Difficulty:</span>
    <div class="filter-group" id="diff-chips"></div>
  </div>
  <div style="padding:12px 16px 0; max-width:860px; margin:0 auto;">
    <div class="word-helper" id="study-helper"></div>
  </div>
  <div class="page" id="page-study" style="display:block">
    <div class="card-grid" id="card-grid"></div>
  </div>
</div>

<!-- ══════════ QUIZ PAGE ══════════ -->
<div class="page" id="page-quiz">
  <!-- Setup -->
  <div class="quiz-setup" id="quiz-setup">
    <div class="setup-title"><i class="fa fa-sliders"></i> Quiz Settings</div>
    <div class="setup-row">
      <label>Select Units</label>
      <div class="setup-chips" id="quiz-unit-chips"></div>
    </div>
    <div class="setup-row">
      <label>Select Difficulty</label>
      <div class="setup-chips" id="quiz-diff-chips"></div>
    </div>
    <div class="setup-row">
      <label>Number of Questions</label>
      <div class="setup-chips" id="quiz-count-chips"></div>
    </div>
    <button class="start-btn" onclick="startQuiz()"><i class="fa fa-play"></i> Start Quiz</button>
  </div>

  <!-- Quiz in progress -->
  <div id="quiz-area" style="display:none">
    <div class="quiz-header">
      <div class="quiz-meta">
        <span class="quiz-progress-text" id="q-progress">Question 1 of 10</span>
        <span class="quiz-score-text" id="q-score">Score: 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="q-progress-bar" style="width:0%"></div></div>
    </div>
    <div class="word-helper" id="quiz-helper"></div>
    <div class="q-card">
      <div class="q-passage" id="q-passage"></div>
      <div class="tts-row">
        <button class="tts-btn" onclick="speakPassage()"><i class="fa fa-volume-high"></i> Listen</button>
      </div>
      <div class="options-grid" id="q-options"></div>
      <div class="feedback-box" id="q-feedback"></div>
      <button class="next-btn" id="q-next" onclick="nextQuestion()">Next Question <i class="fa fa-arrow-right"></i></button>
    </div>
  </div>

  <!-- Result -->
  <div class="result-screen" id="quiz-result">
    <div class="result-icon" id="result-icon">🎉</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-pct" id="result-pct"></div>
    <div class="result-msg-en" id="result-en"></div>
    <div class="result-msg-cn" id="result-cn"></div>
    <button class="restart-btn" onclick="resetQuiz()"><i class="fa fa-rotate-right"></i> Try Again</button>
  </div>
</div>

<!-- ══════════ WORD MODAL ══════════ -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="modal-word" id="m-word"></div>
          <div class="modal-pos" id="m-pos"></div>
        </div>
        <button class="modal-close" onclick="closeModalDirect()"><i class="fa fa-times"></i></button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-row">
        <div class="modal-label">Definition</div>
        <div class="modal-val" id="m-def"></div>
      </div>
      <div class="modal-row">
        <div class="modal-label">中文釋義</div>
        <div class="modal-val modal-cn" id="m-cn"></div>
      </div>
      <div class="modal-row">
        <div class="modal-label">Synonyms</div>
        <div class="modal-val" id="m-syn"></div>
      </div>
      <div class="modal-row">
        <div class="modal-label">SAT Sample Passage</div>
        <div class="modal-passage" id="m-passage"></div>
        <button class="tts-btn" onclick="speakModal()"><i class="fa fa-volume-high"></i> Listen to Passage</button>
        <div class="modal-cn-passage" id="m-cn-passage"></div>
      </div>
      <div class="modal-row" id="m-dict-row" style="display:none">
        <div class="modal-label">Dictionary</div>
        <div class="modal-val" id="m-dict"></div>
      </div>
    </div>
  </div>
</div>

<script>

lity of traditional investigative work. Her critics countered that digital platforms had expanded access to information in ways that print journalism had never achieved.","cnPassage":"這位資深記者以幾乎毫不掩飾的蔑視看待社交媒體報導，認為簡短的帖子永遠無法取代傳統調查性工作的深度和問責性。她的批評者反駁說，數字平台以印刷新聞業從未實現的方式擴大了信息獲取渠道。"},{"unit":4,"difficulty":1,"word":"intimidate","pos":"v.","def":"to frighten or overawe someone deliberately","synonyms":"threaten, bully, coerce.","cn":"恐嚇；威嚇","passage":"The defense attorney objected when it became clear that prosecutors had attempted to __________ key witnesses before the trial. The judge warned that any further interference with testimony would result in serious legal consequences and jeopardize the fairness of the entire proceeding.","cnPassage":"當辯護律師發現檢察官試圖在審判前恐嚇關鍵證人時，他提出了反對。法官警告說，任何進一步干預證詞的行為將導致嚴重的法律後果，並危及整個程序的公正性。"},{"unit":4,"difficulty":1,"word":"promulgate","pos":"v.","def":"to make a law or decree officially known","synonyms":"announce, proclaim, disseminate.","cn":"公布；頒布（法律或法令）","passage":"The agency was authorized to __________ new environmental standards that would take effect within sixty days of publication. Industry leaders called for more time to comply, while environmental groups argued that delaying the rules would cause measurable harm to air and water quality.","cnPassage":"該機構被授權頒布新的環境標準，這些標準將在發布後六十天內生效。行業領袖要求更多時間來遵守，而環保團體則認為推遲實施這些規定將對空氣和水質造成可測量的危害。"},{"unit":4,"difficulty":1,"word":"pugnacious","pos":"adj.","def":"eager to argue or fight; quarrelsome","synonyms":"quarrelsome, belligerent, contentious.","cn":"好鬥的；愛爭吵的","passage":"The __________ coach was known for challenging referees' calls loudly and frequently, believing that an aggressive approach gave his team a psychological advantage. However, his repeated ejections from games ultimately harmed team morale and drew criticism from league officials.","cnPassage":"這位好鬥的教練以頻繁大聲質疑裁判判決而聞名，認為這種強硬做法給他的球隊帶來了心理優勢。然而，他反覆遭到比賽驅逐，最終損害了球隊士氣，並招致聯賽官員的批評。"},{"unit":4,"difficulty":1,"word":"scurrilous","pos":"adj.","d r-heavy drinks, explaining that these choices contributed significantly to long-term metabolic problems. She emphasized that building lasting healthy habits was more effective than relying on temporary restrictive diets.","cnPassage":"這位營養師建議她的客戶避開加工食品和含糖量高的飲料，解釋說這些選擇對長期代謝問題有很大影響。她強調，建立持久的健康習慣比依賴臨時的限制性飲食更為有效。"},{"unit":6,"difficulty":1,"word":"fiasco","pos":"n.","def":"a complete and embarrassing failure","synonyms":"debacle, disaster, catastrophe.","cn":"慘敗；一團糟","passage":"The product launch became a __________ when the company's website crashed under the surge of traffic and orders could not be processed. Customers flooded social media with complaints, and the company issued an emergency apology while working around the clock to restore service.","cnPassage":"當公司網站在流量激增下崩潰且訂單無法處理時，產品發布成為了一場慘敗。客戶在社交媒體上湧現大量投訴，公司在全力恢復服務的同時發出了緊急道歉。"},{"unit":6,"difficulty":1,"word":"laudable","pos":"adj.","def":"deserving praise; commendable","synonyms":"praiseworthy, commendable, admirable.","cn":"值得讚賞的；可嘉的","passage":"The volunteer team's __________ efforts to rebuild the flood-damaged community center earned recognition from local government and national charitable organizations. Their dedication to helping others in need, despite long hours and difficult conditions, inspired many in the wider region to contribute.","cnPassage":"這個義工團隊重建因洪水受損的社區中心的值得讚賞的努力，獲得了地方政府和全國慈善機構的認可。儘管工作時間長、條件艱難，他們幫助有需要者的奉獻精神激勵了更廣泛地區的許多人參與貢獻。"},{"unit":6,"difficulty":1,"word":"perfunctory","pos":"adj.","def":"done with minimal effort; superficial","synonyms":"cursory, superficial, careless.","cn":"敷衍的；草率的","passage":"The inspector's __________ review of the building's safety systems raised concerns among residents, who feared that a hasty examination would fail to detect serious structural risks. They petitioned the city for a more thorough assessment conducted by a fully independent team.","cnPassage":"督察對大廈安全系統的敷衍了事的審查引發了居民的擔憂，他們擔心草率的檢查將無法發現嚴重的結構風險。他們向市政府請願，要求由完全獨立的團隊進行更全面的評估。"},{"unit":6,"difficulty":1,"w any reported feeling noticeably sharper and more confident during subsequent practice sessions.","cnPassage":"在連續六週的密集訓練後，教練組在冠軍錦標賽開始前給予運動員短暫的喘息。休息期讓球員在身心上得到恢復，許多人表示在隨後的練習課程中感到明顯更敏銳和更自信。"},{"unit":8,"difficulty":1,"word":"sinister","pos":"adj.","def":"suggesting something evil or threatening","synonyms":"ominous, menacing, threatening.","cn":"邪惡的；不祥的","passage":"Investigators discovered a __________ pattern of behavior suggesting the suspect had deliberately targeted elderly victims over many years. The systematic nature of the scheme indicated careful planning rather than opportunistic crime, significantly affecting how prosecutors would present the case.","cnPassage":"調查人員發現了一種邪惡的行為模式，暗示嫌疑人多年來故意針對年長受害者。這個計劃的系統性表明是經過精心策劃的，而非機會性犯罪，這顯著影響了檢察官將如何呈現案件。"},{"unit":8,"difficulty":1,"word":"thwart","pos":"v.","def":"to prevent someone from accomplishing a goal","synonyms":"obstruct, foil, stymie.","cn":"阻撓；挫敗","passage":"Security systems successfully __________ the attempted data breach before any sensitive records were accessed or removed. The quick detection and containment response was later highlighted as an example of best practice in network defense, prompting other organizations to adopt similar layered protection measures.","cnPassage":"安全系統在任何敏感記錄被訪問或移除之前，成功挫敗了企圖的數據洩露事件。這次快速的偵測和圍堵反應後來被作為網絡防禦最佳實踐的例子，促使其他機構採用類似的多層次保護措施。"},{"unit":9,"difficulty":1,"word":"bigot","pos":"n.","def":"a narrow-minded person intolerant of others' views","synonyms":"zealot, extremist, fanatic.","cn":"偏執者；頑固的偏見者","passage":"The community organization worked to challenge the views of those who acted like a __________, promoting dialogue and education as alternatives to prejudice. Leaders argued that direct engagement, rather than avoidance, was the most effective way to shift deeply rooted attitudes over time.","cnPassage":"社區組織致力於挑戰那些像偏執者一樣行事的人的觀點，提倡對話和教育作為偏見的替代方案。領袖們認為，直接接觸而非迴避，是隨著時間的推移改變根深蒂固態度最有效的方式。"},{"unit":9,"difficulty":2,"word":"blatant","pos":"adj.","def":"obviously wrong and done without shame","synonyms":"flagrant, brazen, outright.","cn":"明目張膽的；公然的","passage":"The journalist documented a __________ conflict of interest when the official awarded contracts to a company owned by a close relative. The report triggered an independent ethics review and reignited public debate about the need for stricter financial disclosure requirements for government officials.","cnPassage":"當這名官員將合同授予一家由近親擁有的公司時，記者記錄了一個明目張膽的利益衝突。該報告引發了一項獨立的道德審查，並重新引發了公眾對政府官員需要更嚴格財務申報要求的辯論。"},{"unit":9,"difficulty":1,"word":"extortion","pos":"n.","def":"obtaining something through threats or force","synonyms":"blackmail, coercion, shakedown.","cn":"勒索；敲詐","passage":"The organized crime group was charged with __________ after evidence revealed they had been demanding payments from local business owners in exchange for protection from vandalism and theft. Prosecutors presented recordings and financial records as evidence of the coordinated scheme.","cnPassage":"有組織犯罪集團被指控勒索，因為有證據表明他們一直向當地企業主索取費用，以換取保護他們免受破壞和盜竊。檢察官提交了錄音和財務記錄作為這個有組織計劃的證據。"},{"unit":9,"difficulty":2,"word":"loath","pos":"adj.","def":"reluctant or unwilling to do something","synonyms":"reluctant, averse, unwilling.","cn":"不情願的；勉強的","passage":"The board was __________ to approve the proposed expansion without a more thorough market analysis, fearing that premature growth could strain the company's cash reserves. Directors requested a detailed financial projection covering at least three scenarios before any vote would take place.","cnPassage":"董事會不情願在沒有更全面的市場分析的情況下批准擬議的擴張，擔心過早的增長可能會給公司的現金儲備帶來壓力。董事要求提供涵蓋至少三種情景的詳細財務預測，然後才能進行任何投票。"},{"unit":9,"difficulty":1,"word":"malady","pos":"n.","def":"a disease or disorder of the body or mind","synonyms":"disease, ailment, disorder.","cn":"疾病；弊病","passage":"Chronic stress is increasingly recognized as a __________ with serious physical consequences, including elevated blood pressure and weakened immune response. Health professionals urge patients to treat it with the same seriousness as other conditions, seeking both lifestyle adjustments and professional guidance.","cnPassage":"慢性壓力越來越被認為是一種具有嚴重身體後果的疾病，包括血壓升高和免疫反應減弱。醫療專業人員敦促患者以與其他疾病同樣的嚴肅態度對待它，尋求生活方式的調整和專業指導。"},{"unit":9,"difficulty":1,"word":"nefarious","pos":"adj.","def":"wicked and criminal; morally very bad","synonyms":"villainous, sinister, corrupt.","cn":"邪惡的；罪惡的","passage":"The documentary exposed the __________ activities of an international trafficking network that had operated under the disguise of a legitimate shipping business for nearly a decade. Law enforcement agencies from multiple countries coordinated their efforts to dismantle the operation simultaneously.","cnPassage":"這部紀錄片揭露了一個國際販賣網絡的罪惡活動，該網絡幾乎在十年間以合法運輸業務為掩護運作。來自多個國家的執法機構協調努力，同時瓦解了這一組織。"},{"unit":9,"difficulty":1,"word":"scrutinize","pos":"v.","def":"to examine something very carefully and critically","synonyms":"inspect, examine, investigate.","cn":"仔細檢查；審查","passage":"Auditors were brought in to __________ every line of the corporation's financial statements following allegations of irregular accounting practices. The detailed review eventually uncovered discrepancies that had gone unnoticed during routine checks, supporting the call for additional regulatory oversight.","cnPassage":"在出現不規則會計做法的指控後，審計人員被請來仔細審查公司財務報表的每一行。詳細審查最終發現了在常規檢查中未被注意到的差異，支持了對額外監管監督的呼籲。"},{"unit":9,"difficulty":2,"word":"solicit","pos":"v.","def":"to ask for or try to obtain something from someone","synonyms":"request, petition, seek.","cn":"懇求；徵求","passage":"The nonprofit decided to __________ donations from alumni for the new scholarship fund by sending personalized letters that highlighted the direct impact contributions would have on students from disadvantaged backgrounds. The campaign exceeded its fundraising target within the first two months.","cnPassage":"這個非牟利機構決定向校友徵求對新獎學金基金的捐款，發送個性化信件，突出捐款對來自弱勢背景學生的直接影響。該活動在前兩個月內超過了籌款目標。"},{"unit":9,"difficulty":1,"word":"vexatious","pos":"adj.","def":"causing irritation or annoyance","synonyms":"irritating, bothersome, frustrating.","cn":"令人煩惱的；惱人的","passage":"The repeated system errors proved __________, forcing the research team to restart their data analysis multiple times in a single afternoon. The technical department eventually traced the problem to a software conflict that had been introduced during a routine update earlier that week.","cnPassage":"反覆出現的系統錯誤令人煩惱，迫使研究團隊在一個下午多次重新開始數據分析。技術部門最終將問題追溯到本週早些時候在例行更新期間引入的軟件衝突。"},{"unit":9,"difficulty":1,"word":"virulent","pos":"adj.","def":"extremely harmful; intensely hostile","synonyms":"deadly, malignant, toxic.","cn":"劇毒的；惡意的","passage":"Health officials warned that the newly identified strain was more __________ than previous variants, spreading rapidly through close contact and causing severe complications in vulnerable populations. Emergency containment protocols were activated across all affected regions to slow transmission.","cnPassage":"衛生官員警告說，新發現的毒株比以前的變異株更具毒性，通過密切接觸迅速傳播，並在脆弱人群中引起嚴重的並發症。跨所有受影響地區的緊急遏制協議被啟動以減緩傳播。"},{"unit":10,"difficulty":1,"word":"imminent","pos":"adj.","def":"about to happen very soon; impending","synonyms":"impending, approaching, forthcoming.","cn":"即將發生的；迫近的","passage":"Geologists issued warnings that a major landslide was __________, urging residents of the vulnerable hillside community to evacuate immediately. The combination of heavy rain and unstable soil conditions created a dangerous situation that could not safely be monitored from within the risk zone.","cnPassage":"地質學家發出警告，重大山泥傾瀉即將發生，敦促脆弱山坡社區的居民立即疏散。大雨和不穩定土壤條件的結合創造了一個無法在風險區域內安全監測的危險情況。"},{"unit":10,"difficulty":2,"word":"inclement","pos":"adj.","def":"stormy or unpleasantly cold; harsh","synonyms":"severe, harsh, stormy.","cn":"惡劣的（天氣）；嚴酷的","passage":"The outdoor ceremony was postponed due to __________ weather, as organizers determined that heavy wind and rain would make conditions unsafe for both performers and the audience. An indoor venue was arranged at short notice, and the event proceeded successfully the following afternoon.","cnPassage":"由於天氣惡劣，戶外典禮被推遲，因為組織者確定強風和大雨將使表演者和觀眾的條件不安全。在短時間內安排了一個室內場地，活動在第二天下午順利進行。"},{"unit":10,"difficulty":1,"word":"inert","pos":"adj.","def":"unable to move; having no active properties","synonyms":"inactive, motionless, passive.","cn":"遲鈍的；惰性的","passage":"The sedative left the patient completely __________ during the minor procedure, eliminating any risk of involuntary movement that might complicate the delicate work. Medical staff monitored vital signs continuously throughout, ensuring a safe and controlled environment for the entire duration.","cnPassage":"鎮靜劑使患者在輕微手術期間完全失去活動能力，消除了任何可能使精細工作複雜化的非自主運動風險。醫療人員在整個過程中持續監測生命體征，確保整個過程的安全和受控環境。"},{"unit":10,"difficulty":1,"word":"interject","pos":"v.","def":"to interrupt a conversation with a comment","synonyms":"interrupt, insert, interpose.","cn":"插嘴；插入（評論）","passage":"The moderator permitted audience members to __________ brief questions during the panel discussion, believing that spontaneous input would make the conversation more dynamic and relevant. Panelists appreciated the format, though they occasionally had to redirect discussions that drifted far from the central topic.","cnPassage":"主持人允許觀眾在小組討論中插入簡短的問題，認為即興的意見會使對話更具動感和關聯性。小組成員欣賞這種形式，儘管他們有時不得不將偏離中心議題太遠的討論重新引導回來。"},{"unit":10,"difficulty":3,"word":"pertinent","pos":"adj.","def":"directly related or relevant to a topic","synonyms":"relevant, applicable, germane.","cn":"相關的；切題的","passage":"The lawyer objected to the line of questioning, arguing that the witness's personal history was not __________ to the charges being considered by the court. The judge agreed and instructed the opposing counsel to focus only on evidence directly connected to the events in question.","cnPassage":"律師反對這一系列的詢問，認為證人的個人經歷與法庭審議的指控沒有相關性。法官同意了，並指示對方律師只專注於直接與所涉事件相關的證據。"},{"unit":10,"difficulty":2,"word":"peruse","pos":"v.","def":"to read something carefully and thoroughly","synonyms":"examine, scrutinize, study.","cn":"仔細閱讀；細讀","passage":"Before signing the partnership agreement, the legal team spent several days __________ every clause to identify potential risks and ambiguous language. Their thorough review led to fourteen proposed amendments, most of which the other party accepted in the interest of finalizing the deal.","cnPassage":"在簽署合作協議之前，法律團隊花了幾天時間仔細閱讀每一條款，以識別潛在風險和模糊語言。他們的全面審查提出了十四項建議修訂，其中大部分被對方接受，以完成交易。"},{"unit":10,"difficulty":1,"word":"premonition","pos":"n.","def":"a strong feeling that something bad will happen","synonyms":"foreboding, presentiment, harbinger.","cn":"預感；不祥的預兆","passage":"She had a nagging __________ that the journey would not go smoothly, and asked the driver to double-check the vehicle before they departed. Her instinct proved correct when a fault was discovered in the brake system that would have made highway travel genuinely dangerous.","cnPassage":"她有一種揮之不去的預感，旅途不會順利，並要求司機在出發前仔細檢查車輛。她的直覺被證明是正確的，因為發現了制動系統的一個缺陷，這將使高速公路行駛真正危險。"},{"unit":10,"difficulty":1,"word":"recoil","pos":"v.","def":"to draw back in fear or disgust","synonyms":"flinch, shrink, wince.","cn":"退縮；畏縮","passage":"Many readers __________ at the graphic descriptions of the historical atrocities depicted in the documentary account, yet the author argued that sanitizing such events would dishonor the memory of those who suffered. Honest engagement with difficult history, she maintained, was essential to prevent its repetition.","cnPassage":"許多讀者對紀錄性敘述中描繪的歷史暴行的生動描述感到畏縮，然而作者認為，淡化這些事件將有損於那些受苦者的記憶。她堅持認為，誠實地面對困難的歷史，對於防止其重蹈覆轍至關重要。"},{"unit":10,"difficulty":2,"word":"salient","pos":"adj.","def":"most noticeable or important; standing out","synonyms":"prominent, key, significant.","cn":"最突出的；重要的","passage":"The report identified three __________ factors that had contributed to the organization's declining performance: outdated technology, high staff turnover, and inconsistent strategic direction. Addressing these prominent issues, the consultants argued, would need to take priority before any other improvements could take effect.","cnPassage":"報告確認了導致機構業績下滑的三個最突出的因素：過時的技術、高員工流失率和不一致的戰略方向。顧問們認為，在任何其他改善措施生效之前，需要優先解決這些重要問題。"},{"unit":10,"difficulty":1,"word":"squeamish","pos":"adj.","def":"easily upset or disgusted; overly sensitive","synonyms":"oversensitive, nervous, squeamish.","cn":"易受驚的；神經質的","passage":"Those who are __________ about medical procedures may find certain training simulations difficult to observe, yet exposure to realistic scenarios is considered essential preparation for clinical work. Instructors encourage students to gradually build tolerance while maintaining genuine empathy for patient experiences.","cnPassage":"那些對醫療程序容易感到不適的人，可能會發現某些培訓模擬很難觀看，然而接觸真實場景被認為是臨床工作的基本準備。教師鼓勵學生在逐漸建立耐受力的同時，對患者的經歷保持真實的同情心。"},{"unit":10,"difficulty":1,"word":"wan","pos":"adj.","def":"unusually pale; looking weak or unwell","synonyms":"pale, sickly, pallid.","cn":"蒼白的；虛弱的","passage":"The patient's __________ complexion and low energy levels indicated that her recovery was progressing more slowly than hoped. The medical team adjusted her treatment plan and encouraged gradual physical activity to help restore her color and strength over the following weeks.","cnPassage":"患者蒼白的膚色和低能量水準表明她的恢復進展比希望的要慢。醫療團隊調整了她的治療計劃，並鼓勵循序漸進的體能活動，幫助她在接下來的幾週內恢復膚色和體力。"}];

// ══════════ STATE ══════════
let studyFilters = { units: new Set(), diffs: new Set() };
let quizSettings = { units: new Set(), diffs: new Set(), count: 20 };
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let totalScore = 0;
let totalAnswered = 0;
let currentWord = null;
let modalWord = null;

// ══════════ INIT ══════════
function init() {
  const units = [...new Set(ALL_WORDS.map(w => w.unit))].sort((a,b)=>a-b);
  const diffs = [...new Set(ALL_WORDS.map(w => w.difficulty))].sort((a,b)=>a-b);
  const diffLabels = {1:'★ Easy',2:'★★ Medium',3:'★★★ Hard',4:'★★★★ Expert'};

  // Study filters
  const uc = document.getElementById('unit-chips');
  units.forEach(u => {
    const c = makeChip('U'+u, 'unit-study', u, () => toggleFilter(studyFilters.units, u, renderCards));
    uc.appendChild(c);
  });
  const dc = document.getElementById('diff-chips');
  diffs.forEach(d => {
    const c = makeChip(diffLabels[d]||('★'.repeat(d)), 'diff'+d+'-study', d,
      () => toggleFilter(studyFilters.diffs, d, renderCards));
    c.classList.add('diff'+d);
    dc.appendChild(c);
  });

  // Quiz unit chips
  const quc = document.getElementById('quiz-unit-chips');
  units.forEach(u => {
    const c = makeChip('Unit '+u, 'qu'+u, u, () => toggleFilter(quizSettings.units, u, ()=>{}));
    quc.appendChild(c);
  });
  // Quiz diff chips
  const qdc = document.getElementById('quiz-diff-chips');
  diffs.forEach(d => {
    const c = makeChip(diffLabels[d]||('★'.repeat(d)), 'qd'+d, d,
      () => toggleFilter(quizSettings.diffs, d, ()=>{}));
    c.classList.add('diff'+d);
    qdc.appendChild(c);
  });
  // Quiz count chips
  const qcc = document.getElementById('quiz-count-chips');
  [10,20,30,50].forEach(n => {
    const c = document.createElement('button');
    c.className = 'chip' + (n===20?' active':'');
    c.textContent = n + ' Qs';
    c.onclick = () => {
      document.querySelectorAll('#quiz-count-chips .chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      quizSettings.count = n;
    };
    qcc.appendChild(c);
  });

  renderCards();
}

function makeChip(label, id, val, cb) {
  const c = document.createElement('button');
  c.className = 'chip';
  c.id = id;
  c.textContent = label;
  c.onclick = () => { c.classList.toggle('active'); cb(); };
  return c;
}

function toggleFilter(set, val, cb) {
  if (set.has(val)) set.delete(val); else set.add(val);
  cb();
}

// ══════════ STUDY ══════════
function getFilteredWords(filters) {
  return ALL_WORDS.filter(w =>
    (filters.units.size === 0 || filters.units.has(w.unit)) &&
    (filters.diffs.size === 0 || filters.diffs.has(w.difficulty))
  );
}

function renderCards() {
  const words = getFilteredWords(studyFilters);
  const grid = document.getElementById('card-grid');
  if (words.length === 0) {
    grid.innerHTML = '<div class="empty-state"><i class="fa fa-magnifying-glass"></i><p>No words match the selected filters.</p></div>';
    return;
  }
  grid.innerHTML = '';
  words.forEach(w => {
    const card = document.createElement('div');
    card.className = 'flash-card';
    const stars = '★'.repeat(w.difficulty);
    const diffColors = {1:'#2d7a4f',2:'#c8962e',3:'#d05c2f',4:'#b53a2f'};
    card.innerHTML = `
      <div class="fc-header">
        <div><div class="fc-word">${w.word}</div><div class="fc-pos">${w.pos}</div></div>
        <div class="diff-badge" style="background:${diffColors[w.difficulty]+'44'}">${stars}</div>
      </div>
      <div class="fc-body">
        <div class="fc-def">${w.def}</div>
        <div class="fc-cn">${w.cn}</div>
        <div class="fc-syn"><i class="fa fa-link" style="font-size:.7rem;margin-right:4px"></i>${w.synonyms}</div>
        <div class="fc-unit">Unit ${w.unit}</div>
      </div>`;
    card.onclick = () => openModal(w);
    grid.appendChild(card);
  });
}

// ══════════ MODAL ══════════
function openModal(w) {
  modalWord = w;
  document.getElementById('m-word').textContent = w.word;
  document.getElementById('m-pos').textContent = w.pos;
  document.getElementById('m-def').textContent = w.def;
  document.getElementById('m-cn').textContent = w.cn;
  document.getElementById('m-syn').textContent = w.synonyms;
  // Render passage with blank highlighted
  const passageHtml = w.passage.replace(/_{6,}/g,
    '<span class="blank">' + w.word + '</span>');
  document.getElementById('m-passage').innerHTML = passageHtml;
  document.getElementById('m-cn-passage').textContent = w.cnPassage;
  document.getElementById('m-dict-row').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('show');
}
function speakModal() {
  if (!modalWord) return;
  const txt = modalWord.passage.replace(/_{6,}/g, modalWord.word);
  speak(txt);
}

// ══════════ TTS ══════════
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.92;
  const voices = speechSynthesis.getVoices();
  const pref = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('female'))
    || voices.find(v => v.lang === 'en-US')
    || voices.find(v => v.lang.startsWith('en'));
  if (pref) u.voice = pref;
  speechSynthesis.speak(u);
}
window.speechSynthesis && speechSynthesis.addEventListener('voiceschanged', () => {});

// ══════════ QUIZ ══════════
function startQuiz() {
  let pool = getFilteredWords(quizSettings);
  if (pool.length < 4) {
    alert('Please select more words (need at least 4). Choose more units or difficulty levels.');
    return;
  }
  // Shuffle pool and pick questions
  pool = shuffle([...pool]);
  const count = Math.min(quizSettings.count, pool.length);
  quizQuestions = pool.slice(0, count).map(word => {
    // Pick 3 wrong answers from same pool (different word)
    const others = shuffle(pool.filter(w => w.word !== word.word)).slice(0, 3);
    // Build options array with correct word inserted at random position
    const pos = Math.floor(Math.random() * 4);
    const wrongOpts = others.map(o => o.word);
    const opts = [...wrongOpts.slice(0,pos), word.word, ...wrongOpts.slice(pos)];
    return { word, opts, answer: word.word, clues: extractClues(word) };
  });
  quizIndex = 0; quizScore = 0;
  document.getElementById('quiz-setup').style.display = 'none';
  document.getElementById('quiz-result').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'block';
  renderQuestion();
}

function extractClues(word) {
  // Pick 3-4 content words from passage that hint the meaning (not stopwords, not the blank)
  const stop = new Set(['the','a','an','and','or','but','of','to','in','is','was','has','have',
    'had','been','be','by','for','with','on','at','that','this','his','her','its','their',
    'it','he','she','they','we','not','no','as','from','than','more','most','very','also',
    'all','any','each','both','which','who','what','when','where','how','if','so','yet',
    'while','after','before','during','over','into','about','against','between','through']);
  const words = word.passage.replace(/_{6,}/g,'').replace(/[^a-zA-Zs]/g,'').split(/s+/)
    .filter(w => w.length > 3 && !stop.has(w.toLowerCase()));
  return shuffle(words).slice(0, 4);
}

function renderQuestion() {
  if (quizIndex >= quizQuestions.length) { showResult(); return; }
  const q = quizQuestions[quizIndex];
  currentWord = q;

  // Progress
  const pct = (quizIndex / quizQuestions.length) * 100;
  document.getElementById('q-progress').textContent = `Question ${quizIndex+1} of ${quizQuestions.length}`;
  document.getElementById('q-score').textContent = `Score: ${quizScore}`;
  document.getElementById('q-progress-bar').style.width = pct + '%';

  // Passage with clickable words
  const passageHtml = buildPassageHtml(q.word.passage, 'quiz');
  document.getElementById('q-passage').innerHTML = passageHtml;

  // Options
  const letters = ['A','B','C','D'];
  const optDiv = document.getElementById('q-options');
  optDiv.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span> ${opt}`;
    btn.onclick = () => selectAnswer(opt, btn, q);
    optDiv.appendChild(btn);
  });

  document.getElementById('q-feedback').classList.remove('show');
  document.getElementById('q-feedback').innerHTML = '';
  document.getElementById('q-next').classList.remove('show');
  document.getElementById('quiz-helper').classList.remove('show');
}

function buildPassageHtml(passage, ctx) {
  return passage.split(/(s+|_{6,}|[.,!?;:()"])/).map(tok => {
    if (/_{6,}/.test(tok)) return '<span class="blank-target">__________</span>';
    if (/^[a-zA-Z]+$/.test(tok)) {
      const escaped = tok.replace(/'/g,"&#39;");
      return `<span class="word" onclick="lookupWord('${escaped}','${ctx}')">${tok}</span>`;
    }
    return tok;
  }).join('');
}

function lookupWord(word, ctx) {
  const clean = word.toLowerCase().replace(/[^a-z]/g,'');
  const helperId = ctx === 'quiz' ? 'quiz-helper' : 'study-helper';
  const helper = document.getElementById(helperId);
  helper.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Looking up <strong>' + word + '</strong>…';
  helper.classList.add('show');
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + clean)
    .then(r => r.json())
    .then(data => {
      if (!Array.isArray(data) || !data[0]) throw new Error();
      const entry = data[0];
      const meaning = entry.meanings[0];
      const def = meaning?.definitions[0]?.definition || 'No definition found.';
      const pos = meaning?.partOfSpeech || '';
      helper.innerHTML = `<strong>${entry.word}</strong> <em>(${pos})</em> — ${def}`;
    })
    .catch(() => {
      helper.innerHTML = `<strong>${word}</strong>: Definition not found. Try another word.`;
    });
}

function selectAnswer(chosen, btn, q) {
  // Disable all buttons
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  const correct = chosen === q.answer;
  if (correct) { btn.classList.add('correct'); quizScore++; totalScore++; }
  else {
    btn.classList.add('incorrect');
    // Highlight correct
    document.querySelectorAll('.opt-btn').forEach(b => {
      if (b.textContent.trim().slice(2).trim() === q.answer) b.classList.add('correct');
    });
    totalScore++;
  }
  totalAnswered++;
  updateGlobalScore();

  // Highlight clues
  const passageEl = document.getElementById('q-passage');
  q.clues.forEach(clue => {
    passageEl.querySelectorAll('.word').forEach(span => {
      if (span.textContent.toLowerCase() === clue.toLowerCase())
        span.classList.add('clue-highlight');
    });
  });

  // Feedback box
  buildFeedback(q);
  document.getElementById('q-next').classList.add('show');
}

function buildFeedback(q) {
  const fb = document.getElementById('q-feedback');
  fb.innerHTML = '<div class="fb-title"><i class="fa fa-circle-info"></i> All Options Explained</div>';
  q.opts.forEach(opt => {
    const wData = ALL_WORDS.find(w => w.word === opt);
    if (!wData) return;
    const row = document.createElement('div');
    row.className = 'fb-word-row' + (opt === q.answer ? ' is-answer' : '');
    const sentence = wData.passage.replace(/_{6,}/g, opt);
    row.innerHTML = `
      <div class="fb-word-name">${opt} ${opt===q.answer?'<i class="fa fa-check" style="color:var(--correct)"></i>':''}</div>
      <div class="fb-word-en">${wData.def}</div>
      <div class="fb-word-cn">${wData.cn}</div>
      <div class="fb-word-sent">${sentence.length > 120 ? sentence.slice(0,120)+'…' : sentence}</div>
      <button class="tts-btn" style="margin-top:4px" onclick="speak('${sentence.replace(/'/g,"\'").replace(/"/g,'&quot;').slice(0,200)}')">
        <i class="fa fa-volume-low"></i> ${opt}
      </button>`;
    fb.appendChild(row);
  });
  fb.classList.add('show');
}

function speakPassage() {
  if (!currentWord) return;
  const txt = currentWord.word.passage.replace(/_{6,}/g, 'blank');
  speak(txt);
}

function nextQuestion() {
  quizIndex++;
  renderQuestion();
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const pct = Math.round((quizScore / quizQuestions.length) * 100);
  document.getElementById('result-score').textContent = quizScore + ' / ' + quizQuestions.length;
  document.getElementById('result-pct').textContent = pct + '% Correct';
  let icon='🎉', en='', cn='';
  if (pct>=90){icon='🏆';en='Outstanding! You have mastered these words.';cn='太棒了！你已精通這些詞彙。'}
  else if (pct>=75){icon='🌟';en='Great work! Keep reviewing the harder ones.';cn='表現很好！繼續複習困難的詞彙。'}
  else if (pct>=60){icon='👍';en='Good effort! Review the words you missed.';cn='努力得很好！複習一下答錯的詞彙。'}
  else if (pct>=40){icon='📚';en='Keep studying. Consistent review will help.';cn='繼續學習，定期複習會有幫助。'}
  else{icon='💪';en="Don't give up! Every review makes you stronger.";cn='不要放棄！每次複習都讓你進步。'}
  document.getElementById('result-icon').textContent = icon;
  document.getElementById('result-en').textContent = en;
  document.getElementById('result-cn').textContent = cn;
  document.getElementById('quiz-result').classList.add('show');
}

function resetQuiz() {
  document.getElementById('quiz-result').classList.remove('show');
  document.getElementById('quiz-setup').style.display = 'block';
}

function updateGlobalScore() {
  document.getElementById('globalScore').textContent = `Score: ${totalScore} / ${totalAnswered}`;
}

// ══════════ TAB SWITCHING ══════════
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',
    (i===0&&tab==='study')||(i===1&&tab==='quiz')));
  document.getElementById('page-study').classList.toggle('active', tab==='study');
  document.getElementById('page-quiz').classList.toggle('active', tab==='quiz');
}

// ══════════ UTILS ══════════
function shuffle(arr) {
  for (let i = arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// ══════════ BOOT ══════════
document.addEventListener('DOMContentLoaded', init);
</script>
